plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fexed.spacecadetpinball'
    compileSdk 36

    signingConfigs {
        release {
            storeFile file(System.getenv('KEY_STORE'))
            storePassword System.getenv('KEY_STORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId "com.fexed.spacecadetpinball"
        minSdk 21
        targetSdk 36
        versionCode 14
        versionName "v2.5.1-modern"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // 已改用预编译 .so（jniLibs），注释掉 externalNativeBuild 以跳过 native 编译，
    // 使 clone 后无需 NDK / 无需拉取 SDL submodule 即可直接 assembleRelease 打包 APK。
    // 如需重新编译 native，取消注释以下块并恢复 NDK + SDL/SDL_mixer submodule。
    //externalNativeBuild {
    //    cmake {
    //        path file('src/main/cpp/CMakeLists.txt')
    //        version '3.22.1'
    //    }
    //}

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'

        unitTests.all {
            useJUnitPlatform()
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.test:core:1.5.0'
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.junit.jupiter:junit-jupiter-engine:5.7.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
